<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seamrite Designs Business Documents</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--p:#7b3f57;--p2:#c17a8f;--ink:#33232b;--muted:#806c74;--bg:#fcf7f5;--card:#fff;--line:#eadff0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:15px clamp(20px,5vw,70px);display:flex;align-items:center;justify-content:space-between}header img{height:45px;width:auto}header span{color:var(--muted);font-size:.8rem}.shell{max-width:1250px;margin:auto;padding:38px clamp(20px,4vw,60px) 70px}.intro{display:flex;align-items:end;justify-content:space-between;gap:22px;margin-bottom:28px}.intro h1{font:700 clamp(2rem,4vw,3.6rem)/1.1 'Playfair Display',serif;color:var(--p);margin:6px 0}.intro p{color:var(--muted);max-width:560px;margin:0}.layout{display:grid;grid-template-columns:330px 1fr;gap:25px}.panel,.paper{background:var(--card);border:1px solid var(--line);border-radius:25px;box-shadow:10px 12px 24px rgba(91,42,134,.11),-5px -5px 14px rgba(255,255,255,.9),inset 1px 1px 0 #fff;padding:25px}.panel h2{font:700 1.5rem 'Playfair Display',serif;color:var(--p);margin:0 0 18px}.field{margin-bottom:16px}.field label{display:block;font-size:.75rem;font-weight:800;color:var(--muted);margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfd1e8;border-radius:12px;padding:12px;font:inherit;color:var(--ink);background:#fff}.field textarea{min-height:75px;resize:vertical}.items{border-top:1px solid var(--line);padding-top:18px;margin-top:14px}.items h3{font-size:.9rem;margin:0 0 10px}.item{display:grid;grid-template-columns:1fr 62px 84px 34px;gap:6px;margin-bottom:8px}.item input{min-width:0;border:1px solid #dfd1e8;border-radius:9px;padding:9px;font:inherit}.remove{border:0;background:#f4e8f7;color:var(--p);border-radius:9px;font-weight:800}.add,.primary{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.add{background:#f0e3f8;color:var(--p)}.primary{background:linear-gradient(145deg,#b878df,#6d35a0);color:#fff;box-shadow:5px 6px 12px rgba(76,29,149,.2),inset 2px 2px 0 rgba(255,255,255,.28);width:100%;margin-top:18px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.paper{padding:42px;min-height:650px}.paper-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--p);padding-bottom:22px}.paper-logo{height:52px;width:auto}.doc-label{text-align:right}.doc-label h2{font:700 2.1rem 'Playfair Display',serif;color:var(--p);margin:0}.doc-label p{margin:3px 0;color:var(--muted);font-size:.8rem}.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.meta h4{margin:0 0 5px;color:var(--p);font-size:.75rem;text-transform:uppercase;letter-spacing:1px}.meta p{margin:2px 0}.preview-table{width:100%;border-collapse:collapse;margin-top:22px}.preview-table th,.preview-table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}.preview-table th{font-size:.7rem;text-transform:uppercase;color:var(--muted)}.preview-table th:not(:first-child),.preview-table td:not(:first-child){text-align:right}.totals{margin:20px 0 0 auto;max-width:260px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.total{font-weight:800;font-size:1.2rem;color:var(--p);border-top:2px solid var(--line);margin-top:8px;padding-top:12px!important}.notes{margin-top:40px;color:var(--muted);font-size:.85rem;white-space:pre-wrap}.print{background:#f0e3f8;color:var(--p);border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer}@media(max-width:850px){.layout{grid-template-columns:1fr}.paper{padding:25px}.intro{display:block}.panel{order:2}}@media print{header,.intro,.panel,.print{display:none}.shell{padding:0}.layout{display:block}.paper{box-shadow:none;border:0;border-radius:0}}
</style></head><body><header><img src="https://priscadezigns.org/logos/seamritedesigns.jpg" alt="Seamrite Designs logo"><span>Seamrite Designs document workspace</span></header><main class="shell"><div class="intro"><div><small>SEAMRITE DESIGNS</small><h1>Create a document.</h1><p>Select a document type, enter the details and preview a clean branded document ready to print or save as PDF.</p></div><button class="print" onclick="window.print()">Print / Save PDF</button></div><div class="layout"><aside class="panel"><h2>Document details</h2><div class="field"><label>DOCUMENT TYPE</label><select id="type" onchange="render()"><option>Quote / Estimate</option><option>Invoice</option><option>Receipt</option><option>Pro Forma Invoice</option><option>Purchase Order</option><option>Delivery Note</option><option>Credit Note</option></select></div><div class="field"><label>DOCUMENT NUMBER</label><input id="number" value="DOC-0001" oninput="render()"></div><div class="field"><label>DATE</label><input id="date" type="date" oninput="render()"></div><div class="field"><label>CUSTOMER / SUPPLIER</label><input id="party" placeholder="Name or business" oninput="render()"></div><div class="field"><label>EMAIL OR PHONE</label><input id="contact" placeholder="Contact details" oninput="render()"></div><div class="field"><label>NOTES / TERMS</label><textarea id="notes" placeholder="Payment terms, delivery details or other notes" oninput="render()"></textarea></div><div class="items"><h3>Line items</h3><div id="items"></div><button class="add" onclick="addItem()">+ Add line item</button></div><button class="primary" onclick="share()">Share on WhatsApp</button></aside><section class="paper" id="paper"></section></div></main><script>
let rows=[{name:'Your product or service',qty:1,price:0}]; const $=id=>document.getElementById(id); $('date').value=new Date().toISOString().slice(0,10); function money(n){return '$'+Number(n||0).toFixed(2)} function addItem(){rows.push({name:'',qty:1,price:0});drawItems();render()} function drawItems(){ $('items').innerHTML=rows.map((r,i)=>`<div class="item"><input placeholder="Description" value="${r.name}" oninput="rows[${i}].name=this.value;render()"><input type="number" min="0" value="${r.qty}" oninput="rows[${i}].qty=this.value;render()"><input type="number" min="0" step=".01" value="${r.price}" oninput="rows[${i}].price=this.value;render()"><button class="remove" onclick="rows.splice(${i},1);drawItems();render()">×</button></div>`).join('')} function render(){drawItems();let type=$('type').value, sub=rows.reduce((a,r)=>a+(Number(r.qty)||0)*(Number(r.price)||0),0), hasTotal=!['Delivery Note'].includes(type);$('paper').innerHTML=`<div class="paper-head"><img class="paper-logo" src="https://priscadezigns.org/logos/seamritedesigns.jpg" alt="Seamrite Designs logo"><div class="doc-label"><h2>${type}</h2><p>${$('number').value||'DOC-0001'}</p><p>${$('date').value||''}</p></div></div><div class="meta"><div><h4>From</h4><p>Seamrite Designs</p><p>Customized clothing · Trinidad & Tobago</p></div><div><h4>${type==='Purchase Order'?'Supplier':'To'}</h4><p>${$('party').value||'Customer or supplier name'}</p><p>${$('contact').value||'Contact details'}</p></div></div><table class="preview-table"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.name||'—'}</td><td>${r.qty||0}</td><td>${hasTotal?money(r.price):'—'}</td><td>${hasTotal?money((r.qty||0)*(r.price||0)):'—'}</td></tr>`).join('')}</tbody></table>${hasTotal?`<div class="totals"><div><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="total"><span>Total</span><strong>${money(sub)}</strong></div></div>`:''}<div class="notes">${$('notes').value||'Notes and terms will appear here.'}</div>`}function share(){let t=encodeURIComponent('Hello, I have prepared a '+$('type').value+' ('+($('number').value||'document')+').');window.open('https://wa.me/18687910293?text='+t,'_blank')}render();</script></body></html>
